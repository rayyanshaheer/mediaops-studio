<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Form Embed Preview</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 32px;
      max-width: 760px;
      width: 100%;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 1.4rem;
      color: #333;
    }
    iframe {
      display: block;
      margin: 0 auto;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Embedded Google Form</h1>
    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLSfr2uNu4a_m_7ap5UQjr8qzSXMJGYa_CoPX8rnA1G-5albBAQ/viewform?embedded=true"
      width="700"
      height="520"
      frameborder="0"
      marginheight="0"
      marginwidth="0"
    >Loading…</iframe>
  </div>
</body>
</html>
